name: KNHB-programma ophalen

on:
  schedule:
    - cron: '23 5,11,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/knhb.yml'
      - 'scripts/fetch-knhb.mjs'
      - 'data/knhb-config.json'

permissions:
  contents: write

concurrency:
  group: knhb
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Programma ophalen
        run: node scripts/fetch-knhb.mjs
      - name: Opslaan als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knhb.json
          if git diff --cached --quiet; then echo "Geen wijzigingen"; else git commit -m "KNHB-programma bijgewerkt" && git push; fi
