<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KNHB-test</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <main class="screen">
    <h1 class="h1" style="font-size:24px">KNHB-programma: test</h1>
    <p class="sub" style="margin:0">Deze pagina probeert vanaf je telefoon rechtstreeks het programma op te halen bij de KNHB Match Center. Er wordt niets opgeslagen.</p>
    <div class="card">
      <label class="label" for="club">Club</label>
      <input id="club" class="input" value="Spandersbosch" />
      <label class="label" for="team">Team</label>
      <input id="team" class="input" value="JO9-Wit" />
      <button id="go" class="btn primary block" type="button">Ophalen</button>
    </div>
    <div class="card" id="out"><span class="sub">Nog niets opgehaald.</span></div>
  </main>
  <script type="module">
    const API = 'https://publicaties.hockeyweerelt.nl/mc';
    const out = document.getElementById('out');
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const say = (h) => { out.innerHTML = h; };
    const get = async (path) => { const r = await fetch(API + path, { headers: { Accept: 'application/json' } }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };
    const fmt = (iso) => new Date(iso).toLocaleString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const row = (m) => `<div class="col" style="gap:2px;border-top:1px solid var(--line-3);padding-top:8px">
      <b>${esc(fmt(m.datetime))}</b>
      <span>${esc(m.home_team && m.home_team.name)} – ${esc(m.away_team && m.away_team.name)}${m.home_score != null ? ` · ${m.home_score}–${m.away_score}` : ''}</span>
      <span class="small">${esc([m.location && m.location.description, m.location && m.location.city].filter(Boolean).join(', '))}${m.field ? ' · veld ' + esc(m.field) : ''}</span>
    </div>`;
    document.getElementById('go').addEventListener('click', async () => {
      const club = document.getElementById('club').value.trim().toLowerCase();
      const team = document.getElementById('team').value.trim().toLowerCase().replace(/\s+/g, '');
      say('<span class="sub">Bezig…</span>');
      try {
        const clubs = (await get('/clubs')).data || [];
        const c = clubs.find((x) => (x.name || '').toLowerCase().includes(club));
        if (!c) { say(`<b>Verbinding werkt ✓</b><span class="sub">${clubs.length} clubs gevonden, maar geen club met "${esc(club)}".</span>`); return; }
        const teams = (await get(`/clubs/${c.id}/teams`)).data || [];
        const t = teams.find((x) => [x.name, x.short_name].some((n) => (n || '').toLowerCase().replace(/\s+/g, '').includes(team)));
        if (!t) { say(`<b>Verbinding werkt ✓</b><span class="sub">${esc(c.name)}: ${teams.length} teams, maar "${esc(team)}" niet gevonden.</span><span class="small">${teams.map((x) => esc(x.name)).join(' · ')}</span>`); return; }
        const [up, done] = await Promise.all([get(`/teams/${t.id}/matches/upcoming`), get(`/teams/${t.id}/matches/official`).catch(() => ({ data: [] }))]);
        say(`<b>Verbinding werkt ✓</b><span class="sub">${esc(c.name)} · ${esc(t.name)} (${esc(t.type || '')})</span>
          <span class="label" style="margin-top:6px">Komende wedstrijden</span>${(up.data || []).map(row).join('') || '<span class="small">Geen</span>'}
          <span class="label" style="margin-top:6px">Gespeeld</span>${(done.data || []).slice(-5).map(row).join('') || '<span class="small">Geen</span>'}`);
      } catch (e) {
        say(`<b>Ophalen lukt niet rechtstreeks ✗</b><span class="sub">${esc(e.message)}. Dan halen we het programma via GitHub op (dagelijks, automatisch).</span>`);
      }
    });
  </script>
</body>
</html>
